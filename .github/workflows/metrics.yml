name: Metrics (all-time)

on:
  schedule:
    - cron: "30 18 * * *"    # daily, after the other generator
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yufeiz6
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          # all-time contribution calendar (0 = every year since account creation)
          plugin_calendar: yes
          plugin_calendar_limit: 0
          # isometric last-year calendar (nice 3D-ish look)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # language breakdown across all repos
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
